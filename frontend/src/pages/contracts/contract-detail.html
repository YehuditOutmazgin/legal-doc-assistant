<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Details - LegalDoc</title>
  <link rel="stylesheet" href="/src/styles/variables.css">
  <link rel="stylesheet" href="/src/styles/reset.css">
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/pages.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
</head>
<body>
  <div class="page-layout">
    <div id="navbar"></div>
    <div id="mobileNav"></div>

    <div class="page-content">
      <div class="container">
        <!-- Header -->
        <div style="margin-bottom: 2rem;">
          <a href="/src/pages/contracts/contracts.html" style="color: var(--color-primary); display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
            </svg>
            <span>Back to Contracts</span>
          </a>
          <h1 id="pageTitle">New Contract</h1>
        </div>

        <!-- Form -->
        <div class="card">
          <form id="contractForm">
            <div class="form-group">
              <label for="title" class="form-label">Contract Title *</label>
              <input
                type="text"
                id="title"
                name="title"
                class="form-input"
                placeholder="e.g., Rental Agreement"
                required
              />
              <div id="titleError" class="form-error hidden"></div>
            </div>

            <div class="form-group">
              <label for="clientId" class="form-label">Client *</label>
              <select id="clientId" name="clientId" class="form-select" required>
                <option value="">Select client...</option>
              </select>
              <div id="clientIdError" class="form-error hidden"></div>
            </div>

            <div class="form-group">
              <label for="status" class="form-label">Status *</label>
              <select id="status" name="status" class="form-select" required>
                <option value="DRAFT">DRAFT</option>
                <option value="REVIEW">REVIEW</option>
                <option value="SIGNED">SIGNED</option>
                <option value="ARCHIVED">ARCHIVED</option>
              </select>
            </div>

            <div class="form-group">
              <label for="templateId" class="form-label">Template (Optional)</label>
              <select id="templateId" name="templateId" class="form-select">
                <option value="">No template</option>
              </select>
            </div>

            <div class="form-group">
              <label for="content" class="form-label">Contract Content *</label>
              <textarea
                id="content"
                name="content"
                class="form-textarea"
                placeholder="Enter contract content..."
                required
                style="min-height: 300px;"
              ></textarea>
              <div id="contentError" class="form-error hidden"></div>
            </div>

            <div class="form-group">
              <label for="notes" class="form-label">Notes (Optional)</label>
              <textarea
                id="notes"
                name="notes"
                class="form-textarea"
                placeholder="Additional notes..."
              ></textarea>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end; flex-wrap: wrap;">
              <button type="button" id="cancelBtn" class="btn btn-secondary">
                Cancel
              </button>
              <button type="submit" id="saveBtn" class="btn btn-primary">
                <span id="saveBtnText">Save</span>
                <span id="saveBtnLoader" class="loader hidden"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="./contract-detail.ts"></script>
</body>
</html>
