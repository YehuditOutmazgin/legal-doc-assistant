<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Details - LegalDoc</title>
  <link rel="stylesheet" href="/src/styles/variables.css">
  <link rel="stylesheet" href="/src/styles/reset.css">
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/pages.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
</head>
<body>
  <div class="page-layout">
    <div id="navbar"></div>
    <div id="mobileNav"></div>

    <div class="page-content">
      <div class="container">
        <div style="margin-bottom: 2rem;">
          <a href="/src/pages/clients/clients.html" style="color: var(--color-primary); display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
            </svg>
            <span>Back to Clients</span>
          </a>
          <h1 id="pageTitle">New Client</h1>
        </div>

        <div class="card">
          <form id="clientForm">
            <div class="form-group">
              <label for="name" class="form-label">Name *</label>
              <input type="text" id="name" class="form-input" placeholder="Full name / Company name" required/>
              <div id="nameError" class="form-error hidden"></div>
            </div>

            <div class="form-group">
              <label for="type" class="form-label">Client Type *</label>
              <select id="type" class="form-select" required>
                <option value="INDIVIDUAL">INDIVIDUAL</option>
                <option value="COMPANY">COMPANY</option>
              </select>
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email *</label>
              <input type="email" id="email" class="form-input" placeholder="email@example.com" required/>
              <div id="emailError" class="form-error hidden"></div>
            </div>

            <div class="form-group">
              <label for="phone" class="form-label">Phone *</label>
              <input type="tel" id="phone" class="form-input" placeholder="+1-234-567-8900" required/>
              <div id="phoneError" class="form-error hidden"></div>
            </div>

            <div class="form-group">
              <label for="address" class="form-label">Address *</label>
              <input type="text" id="address" class="form-input" placeholder="Street, City, State" required/>
              <div id="addressError" class="form-error hidden"></div>
            </div>

            <div id="companyFields" class="hidden">
              <div class="form-group">
                <label for="companyRegistrationNumber" class="form-label">Company Registration Number</label>
                <input type="text" id="companyRegistrationNumber" class="form-input" placeholder="123456789"/>
              </div>

              <div class="form-group">
                <label for="contactPersonName" class="form-label">Contact Person</label>
                <input type="text" id="contactPersonName" class="form-input" placeholder="Contact person name"/>
              </div>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end; flex-wrap: wrap;">
              <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
              <button type="submit" id="saveBtn" class="btn btn-primary">
                <span id="saveBtnText">Save</span>
                <span id="saveBtnLoader" class="loader hidden"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="./client-detail.ts"></script>
</body>
</html>
